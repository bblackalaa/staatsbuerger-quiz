    let showSolutionMode = false;

    // ===== Distractors automatisch erzeugen =====
    function addDistractors(questionArray) {
      const allCorrect = [];
      questionArray.forEach(q => {
        q.correct.forEach(ans => {
          if (!allCorrect.includes(ans)) {
            allCorrect.push(ans);
          }
        });
      });

      questionArray.forEach(q => {
        const own = new Set(q.correct);
        const candidates = allCorrect.filter(ans => !own.has(ans));
        shuffleArray(candidates);
        const distractors = candidates.slice(0, Math.min(3, candidates.length));
        q.distractors = distractors;
      });
    }

    function shuffleArray(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
    }

    // Quiz-Logik
    let questions = JSON.parse(JSON.stringify(questionsBmiGeschichte));
    addDistractors(questions);
    shuffleArray(questions);

    let currentIndex = 0;
    let score = 0;
    let currentOptions = [];
    let currentCorrectIndices = new Set();

    const startScreen = document.getElementById("start-screen");
    const quizScreen = document.getElementById("quiz-screen");
    const startBtn = document.getElementById("startBtn");
    const nextBtn = document.getElementById("nextBtn");
    const progressDiv = document.getElementById("progress");
    const questionDiv = document.getElementById("question");
    const optionsDiv = document.getElementById("options");
    const resultDiv = document.getElementById("result");

    startBtn.addEventListener("click", () => {
      startScreen.style.display = "none";
      quizScreen.style.display = "block";
      showQuestion();
    });

    nextBtn.addEventListener("click", () => {
      nextQuestion();
    });

    function showQuestion() {
      if (currentIndex >= questions.length) {
        finishQuiz();
        return;
      }

      const q = questions[currentIndex];
      progressDiv.textContent = `Frage ${currentIndex + 1} von ${questions.length}`;
      questionDiv.textContent = q.question;

      const opts = [...q.correct, ...(q.distractors || [])];
      shuffleArray(opts);
      currentOptions = opts;
      currentCorrectIndices = new Set(
        opts.map((opt, i) => (q.correct.includes(opt) ? i : -1)).filter(i => i >= 0)
      );

      optionsDiv.innerHTML = "";
      opts.forEach((opt, idx) => {
        const label = document.createElement("label");
        label.className = "option";
        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.value = idx;
        label.appendChild(cb);
        label.appendChild(document.createTextNode(" " + opt));
        optionsDiv.appendChild(label);
      });

      resultDiv.textContent = "";
      resultDiv.style.color = "black";
      nextBtn.textContent = "Weiter";
    }

    function nextQuestion() {
      // إذا كنا في وضع إظهار الحل، ننتقل للسؤال التالي
      if (showSolutionMode) {
        showSolutionMode = false;
        currentIndex += 1;
        if (currentIndex < questions.length) {
          showQuestion();
        } else {
          finishQuiz();
        }
        return;
      }

      // أول مرة: نتحقق من الإجابة ثم نعرض الحل الصحيح
      const checkboxes = optionsDiv.querySelectorAll("input[type='checkbox']");
      const selected = new Set();
      checkboxes.forEach(cb => {
        if (cb.checked) {
          selected.add(parseInt(cb.value, 10));
        }
      });

      const isCorrect = setsEqual(selected, currentCorrectIndices);
      if (isCorrect) {
        score += 1;
        resultDiv.textContent = "Richtig!";
        resultDiv.style.color = "green";
      } else {
        resultDiv.textContent = "Falsch.";
        resultDiv.style.color = "red";
      }

      const correctTexts = [];
      currentCorrectIndices.forEach(idx => {
        correctTexts.push(currentOptions[idx]);
      });
      resultDiv.textContent += " Richtige Antwort(en): " + correctTexts.join(" | ");

      showSolutionMode = true;
      nextBtn.textContent = "Weiter zur nächsten Frage";
    }

    function setsEqual(a, b) {
      if (a.size !== b.size) return false;
      for (const val of a) {
        if (!b.has(val)) return false;
      }
      return true;
    }

    function finishQuiz() {
  const percent = (score / questions.length) * 100;
  const passed = percent >= 50.0;
  resultDiv.textContent =
    `Ergebnis: ${score} von ${questions.length} korrekt – ${percent.toFixed(2)}% ` +
    (passed ? "(BESTANDEN)" : "(NICHT BESTANDEN)");
  nextBtn.disabled = true;
}
